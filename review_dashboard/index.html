<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Review Dashboard — printed page vs JSON</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --panel2:#212a34; --ink:#e8edf2;
          --mut:#93a1b0; --acc:#4cc2ff; --ok:#3ddc84; --warn:#ffb454;
          --bad:#ff6b6b; --line:#2c3742; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--mut); font-size:12.5px; }
  header a { color:var(--acc); text-decoration:none; font-size:12.5px; }
  header a:hover { text-decoration:underline; }
  main { display:flex; height:calc(100vh - 52px); }
  #list { width:340px; min-width:280px; overflow-y:auto;
          border-right:1px solid var(--line); }
  .grp { padding:10px 14px 4px; color:var(--mut); font-size:11.5px;
         text-transform:uppercase; letter-spacing:.08em; position:sticky;
         top:0; background:var(--bg); }
  .item { padding:9px 14px; border-bottom:1px solid var(--line);
          cursor:pointer; }
  .item:hover { background:var(--panel); }
  .item.sel { background:var(--panel2); box-shadow:inset 3px 0 0 var(--acc); }
  .item .t { font-weight:600; font-size:13px; }
  .item .s { color:var(--mut); font-size:11.5px; margin-top:2px; }
  .chip { display:inline-block; margin:2px 4px 0 0; padding:1px 7px;
          border-radius:9px; background:#3a2c17; color:var(--warn);
          font-size:10.5px; }
  .st { float:right; font-size:10.5px; padding:1px 8px; border-radius:9px; }
  .st.pending { background:#3a2c17; color:var(--warn); }
  .st.decided { background:#123524; color:var(--ok); }
  .st.stale { background:#3d1414; color:var(--bad); }
  #detail { flex:1; overflow-y:auto; padding:18px 22px; }
  #detail h2 { font-size:15px; margin:0 0 4px; }
  #detail .meta { color:var(--mut); font-size:12px; margin-bottom:12px; }
  #detail .meta b { color:var(--warn); }
  table.md { border-collapse:collapse; margin:10px 0 14px;
             background:var(--panel); }
  table.md th, table.md td { border:1px solid var(--line); padding:6px 9px;
        font-size:12.5px; vertical-align:top; max-width:430px; }
  table.md tr:first-child td { background:var(--panel2); font-weight:600; }
  mark { background:#5a3b12; color:var(--warn); border-radius:3px;
         padding:0 2px; }
  .pg { margin:14px 0; }
  .pg .lbl { color:var(--mut); font-size:12px; margin-bottom:5px; }
  .pg img { max-width:100%; border:1px solid var(--line); border-radius:6px; }
  .btn { margin:4px 10px 14px 0; padding:6px 14px; border:1px solid var(--line);
         background:var(--panel2); color:var(--ink); border-radius:6px;
         cursor:pointer; font-size:12.5px; }
  .btn.ok { border-color:var(--ok); color:var(--ok); }
  .btn.bad { border-color:var(--bad); color:var(--bad); }
  textarea { width:100%; min-height:220px; background:var(--panel);
             color:var(--ink); border:1px solid var(--line); border-radius:6px;
             padding:10px; font:12px/1.4 ui-monospace,Consolas,monospace; }
  .msg { color:var(--ok); font-size:12px; margin-left:8px; }
  .msg.err { color:var(--bad); }
  .note { background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:10px 14px; color:var(--mut);
          font-size:12.5px; max-width:780px; }
</style>
</head>
<body>
<header>
  <h1>Table Review Dashboard</h1>
  <span class="sub">QA-flagged tables — printed page vs extracted JSON.
    Edit + approve; decisions persist on the server (append-only ledger)
    and gate the final zip.</span>
  <a href="/">← pipeline</a>
  <span id="zips"></span>
  <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
    <input id="qid" placeholder="q_id e.g. ENT-021-008"
      style="background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:12px;width:170px">
    <button class="btn" style="margin:0" onclick="openQ()">Open</button>
  </span>
</header>
<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script>
let DATA = [], AUDIT = [], sel = null;
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const hl = (s, sus) => { let o = esc(s);
  for (const sp of sus) if (sp) o = o.split(esc(sp)).join("<mark>"+esc(sp)+"</mark>");
  return o; };
async function load(){
  DATA = await (await fetch("/api/queue")).json();
  AUDIT = await (await fetch("/api/audit")).json();
  const books = [...new Set(DATA.map(d=>d.book))];
  document.getElementById("zips").innerHTML =
    books.map(b=>`<a href="/zip/${b}">${b} zip</a>`).join(" &nbsp; ");
  renderList();
  document.getElementById("detail").innerHTML = DATA.length ? "" :
    "<div class='note'>Queue khali hai — no REVIEW tables. Final zip unlocked.</div>";
  if (DATA.length) select(0);
}
function renderList(){
  const el = document.getElementById("list");
  let html = "";
  for (const b of [...new Set(DATA.map(d=>d.book))]){
    const its = DATA.map((it,i)=>[it,i]).filter(([it])=>it.book===b);
    const pend = its.filter(([it])=>it.state==="pending"
      || it.state.startsWith("stale")).length;
    html += `<div class="grp">${b} — ${its.length} flagged, ${pend} pending</div>`;
    for (const [it,i] of its){
      const st = it.state.startsWith("decided") ? "decided"
               : it.state.startsWith("stale") ? "stale" : "pending";
      html += `<div class="item" data-i="${i}" onclick="select(${i})">
        <span class="st ${st}">${st}</span>
        <div class="t">${it.table_id} <span style="color:var(--mut);font-weight:400">${it.q_id}</span></div>
        <div class="s">${it.suspects.map(s=>`<span class="chip">${esc(s)}</span>`).join("")||"no suspects"}${it.cross_page?" · cross-page":""}</div></div>`;
    }
  }
  if (AUDIT.length){
    const by = {};
    for (const f of AUDIT) by[f.kind] = (by[f.kind]||0)+1;
    html += `<div class="grp">Audit scan — ${AUDIT.length} advisory flag(s): ${
      Object.entries(by).map(([k,n])=>k+" ×"+n).join(", ")}</div>`;
    AUDIT.forEach((f,i)=>{
      html += `<div class="item" data-a="${i}" onclick="showAudit(${i})">
        <span class="st ${f.severity==="HIGH"?"stale":"pending"}">${esc(f.kind)}</span>
        <div class="t">${esc(f.q_id||f.chapter_id||"")}</div>
        <div class="s">${esc(f.detail || (f.where+" = "+f.value) || "")}</div></div>`;
    });
  }
  el.innerHTML = html;
  document.querySelectorAll(".item").forEach(e=>
    e.classList.toggle("sel", +e.dataset.i === sel));
}
function showAudit(i){
  sel = null; const f = AUDIT[i];
  document.getElementById("detail").innerHTML =
    `<h2>Audit flag — ${esc(f.kind)}
      <span class="st ${f.severity==="HIGH"?"stale":"pending"}">${esc(f.severity)}</span></h2>
    <div class="meta">${esc(f.book)} · ${esc(f.q_id||"")} · pages ${
      (f.pages||[]).join(", ")||"—"}</div>
    <pre class="note">${esc(JSON.stringify(f,null,2))}</pre>
    <div class="note">Advisory flag from the post-run scan — the output is
      untouched. Verify against the PDF and decide; the scan never edits.
      numeric_drift = number absent from the text layer of its own pages ·
      duplicate_question = same stem extracted twice · thin_options /
      bad_answer = structural damage.</div>
    ${f.q_id?`<button class="btn" style="margin-top:12px"
      onclick="openQ('${esc(f.q_id)}')">Open question →</button>`:""}`;
  renderList(); document.getElementById("detail").scrollTop = 0;
}
async function openQ(id){
  const qid = (id || document.getElementById("qid").value).trim();
  if (!qid) return;
  const r = await fetch("/api/question/"+encodeURIComponent(qid));
  if (!r.ok){ alert(((await r.json()).error) || "not found"); return; }
  showQuestion(await r.json());
}
function showQuestion(d){
  sel = null;
  const q = d.q||{}, a = d.answer||{}, s = d.solution||{};
  document.getElementById("detail").innerHTML = `
   <h2>${esc(q.q_id||"")}
     <span style="color:var(--mut)">(${esc(q.chapter_id||"")})</span></h2>
   <div class="meta">question-level editor — verified, all copies;
     table markdown edit ke liye queue item kholo</div>
   <div style="color:var(--mut);font-size:12px">question_text</div>
   <textarea id="qt" style="min-height:110px">${esc(q.question_text||"")}</textarea>
   ${(q.options||[]).map(o=>`<div style="margin:6px 0">
     <span style="color:var(--warn);font-weight:600">${esc(o.id)}</span>
     <input data-opt="${esc(o.id)}" value="${esc(o.text||"")}"
      style="width:calc(100% - 30px);background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:12.5px"></div>`).join("")}
   <div style="margin:8px 0"><span style="color:var(--mut)">correct_option:</span>
     <select id="co" style="background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px">
       ${"ABCD".split("").map(l=>`<option ${l===(a.correct_option||"")?"selected":""}>${l}</option>`).join("")}
     </select></div>
   <div style="color:var(--mut);font-size:12px">solution_text</div>
   <textarea id="st" style="min-height:90px">${esc(s.solution_text||"")}</textarea>
   <div style="margin-top:8px">
     <button class="btn ok" onclick="saveQ('${esc(q.q_id||"")}','${esc(d.book)}')">Save edit</button>
     <span class="msg" id="qmsg"></span></div>
   ${(q.tables||[]).length?`<div class="note" style="margin-top:12px">${(q.tables||[]).length} table(s) attached — markdown edit queue view me hota hai.</div>`:""}`;
  renderList(); document.getElementById("detail").scrollTop = 0;
}
async function saveQ(qid, book){
  const patch = {
    question_text: document.getElementById("qt").value,
    options: [...document.querySelectorAll("[data-opt]")]
      .map(i=>({id:i.dataset.opt, text:i.value})),
    solution_text: document.getElementById("st").value,
    correct_option: document.getElementById("co").value};
  const r = await fetch("/api/question/"+encodeURIComponent(qid)+"/edit",
    {method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({book, patch})});
  const j = await r.json();
  const m = document.getElementById("qmsg");
  if (j.ok){ m.className="msg";
    m.textContent = `saved to ${j.copies} copie(s), verified ✔`; }
  else { m.className="msg err"; m.textContent = "refused: "+j.why; }
}
const md2html = (md, sus) => {
  const rows = md.split("\n").filter(l=>l.trim())
    .filter((l,i)=>!(i===1&&/^[\s|:-]+$/.test(l)));
  return "<table class='md'>" + rows.map(r=>"<tr>"+
    r.split("|").slice(1,-1).map(c=>`<td>${hl(c.trim(),sus)}</td>`).join("")+
    "</tr>").join("") + "</table>";
};
function select(i){
  sel = i; const it = DATA[i];
  const d = document.getElementById("detail");
  d.innerHTML = `<h2>${it.book} · ${it.table_id}
      <span style="color:var(--mut)">(${it.q_id})</span>
      <span class="st ${it.state.startsWith("decided")?"decided":it.state.startsWith("stale")?"stale":"pending"}">${it.state}</span></h2>
    <div class="meta">suspects: <b>${it.suspects.map(esc).join(", ")||"none"}</b>
      · pages ${it.pages.join(", ")}${it.cross_page?" · merged cross-page":""}</div>
    <button class="btn ok" onclick="decide('approve')">Approve as-is</button>
    <button class="btn" onclick="editMode()">Edit table</button>
    <button class="btn bad" onclick="decide('reject')">Reopen</button>
    <span class="msg" id="msg"></span>
    <div id="editor"></div>
    ${md2html(it.markdown, it.suspects)}
    ${it.pages.map(p=>`<div class="pg"><div class="lbl">printed page ${p}
      (120 dpi) — compare every cell with the JSON above</div>
      <img loading="lazy" src="/crops/${it.book.toLowerCase()}_p${String(p).padStart(4,"0")}.png"></div>`).join("")}`;
  renderList(); d.scrollTop = 0;
}
function editMode(){
  const it = DATA[sel];
  document.getElementById("editor").innerHTML =
    `<textarea id="md">${esc(it.markdown)}</textarea><br>
     <button class="btn ok" onclick="saveEdit()">Save edit + mark fixed</button>
     <span class="msg" id="emsg"></span>`;
}
async function saveEdit(){
  const it = DATA[sel];
  const r = await fetch("/api/edit", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({book:it.book, q_id:it.q_id,
      table_id:it.table_id, markdown:document.getElementById("md").value,
      action:"approve"})});
  const j = await r.json();
  const m = document.getElementById("emsg");
  if (j.ok){ m.textContent = `saved to ${j.copies} copie(s), verified ✔`;
    await load(); select(sel); }
  else { m.className="msg err"; m.textContent = "refused: "+j.why; }
}
async function decide(action){
  const it = DATA[sel];
  await fetch("/api/decision", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({book:it.book, q_id:it.q_id,
      table_id:it.table_id, action})});
  await load(); select(sel);
}
load();
</script>
</body>
</html>
